; Firmware for the BigTreeTech Octopus with the STM32F446ZE (180 MHz Cortex-M4).
; Design decisions: docs/control_system_decisions.md
;
; PlatformIO has no Octopus board, so boards/octopus_f446.json uses STM32duino's generic
; F446ZE variant, with our own clock setup for the board's 12 MHz crystal
; (src/clock_config.cpp) and pin map (src/board_pins.h). The Nucleo-F446ZE board isn't used
; because its variant hard-codes an 8 MHz clock.

[env:octopus_f446]
platform = ststm32
board = octopus_f446
framework = arduino

; Linked at the start of flash (0x08000000), the same as an Arduino IDE build: the board is
; flashed with STM32CubeProgrammer, which replaces BTT's SD-card bootloader. To flash from
; another computer, copy the Arduino sketch instead (arduino/arm_firmware/, see README).
build_src_filter = +<*> -<sim/>   ; src/sim/ is the PC simulator

build_flags =
    -D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC   ; Serial = USB serial on the board's USB-C port (OTG_FS, PA11/PA12)
    -D HSE_VALUE=12000000U                ; 12 MHz crystal

lib_deps =
    teemuatlut/TMCStepper@^0.7.3

monitor_speed = 115200

; Unit tests for lib/arm_core on the PC (no board needed): pio test -e native
[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17 -Wall -Wextra

; The firmware's protocol and motion logic as a PC program on a pseudo-terminal, so
; arm_bridge can be tested against the real firmware code: pio run -e sim, then
; .pio/build/sim/program --link /tmp/sim_octopus
[env:sim]
platform = native
build_src_filter = -<*> +<sim/>
build_flags = -std=gnu++17 -Wall -Wextra
