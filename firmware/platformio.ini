; Firmware for the BigTreeTech Octopus Pro v1.1 (STM32H723ZG).
; Design decisions: docs/control_system_decisions.md
;
; PlatformIO has no Octopus Pro board, so we build for the Nucleo-H723ZG (same chip and
; package) and override what differs: the clock setup (25 MHz crystal, src/clock_config.cpp)
; and the pins (src/board_pins.h).

[env:octopus_pro_h723]
platform = ststm32
board = nucleo_h723zg
framework = arduino

; The board's stock SD-card bootloader occupies the first 128 KiB of flash,
; so the firmware is linked to start after it.
board_build.flash_offset = 0x20000
board_upload.offset_address = 0x08020000
upload_protocol = dfu

build_flags =
    -D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC   ; Serial = USB serial on the board's USB-C port
    -D USE_USB_HS                         ; the H723's only USB peripheral is OTG_HS...
    -D USE_USB_HS_IN_FS                   ; ...run in full speed on PA11/PA12 (no external PHY)
    -D HSE_VALUE=25000000U                ; 25 MHz crystal (the Nucleo uses 8 MHz)
    -D HSE_BYPASS_NOT_USED                ; stops the Nucleo variant resetting HSE_VALUE to 8 MHz

lib_deps =
    teemuatlut/TMCStepper@^0.7.3

monitor_speed = 115200
